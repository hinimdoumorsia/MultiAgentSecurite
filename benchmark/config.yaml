# Configuration du harness de benchmark MultiAgentSecurite
# Tous les chemins sont relatifs a la racine du repo (MultiAgentSecurite/).
#
# STRATEGIE HYBRIDE (plan final) :
#   - C / C++ / Java  -> datasets a negatifs propres (Juliet, OWASP) = metriques HAUTES
#   - Python/PHP/JS/TS/Go -> CVEfixes = metriques INDICATIVES (rappel surtout)
# Le champ `quality` est reporte dans les sorties pour tracer la fiabilite.

# --- Invocation de l'agent ---
agent:
  max_iterations: 3        # max_patch_iterations passe a l'AgentState
  runs_per_case: 1         # k : nb de repetitions par cas (LLM stochastiques). Mettre 3 pour mean +/- std.
  timeout_sec: 600         # garde-fou par cas
  scan_cache: true         # reutilise .scan_cache de l'agent (rate limits free-tier)
  detection_only: true     # true = saute exploit_scorer/patcher/validator (rapide, economise des tokens). Pour benchmarker SEULEMENT la detection.

# --- Regles de matching detection ---
matching:
  line_tolerance: 5        # +/- N lignes de chevauchement pour compter un TP
  cwe_mode: family         # exact | family  (family = parent/enfant accepte via cwe_map)

# --- Datasets actives (mettre enabled: false pour ignorer) ---
datasets:
  # --- Multi-langages, REEL (Python/PHP/JS/TS/Go + complement C/C++/Java) ---
  cvefixes:
    enabled: true
    adapter: cvefixes
    path: benchmark/datasets/cvefixes
    track: detection
    quality: indicative        # negatifs (fixed_code) imparfaits -> precision/FPR bruitees
    scoring: presence          # matching fichier (le code est au niveau region, pas de ligne)
    per_language_limit: 50     # 50 vuln + 50 sains = 100 cas / langage (8 langages -> ~800 cas)
    include_negatives: true
    max_scan: 40000            # garde-fou streaming HF (augmente pour atteindre 50/langage)

  # --- Java, REFERENCE detection (negatifs propres) ---
  # Prerequis : git clone https://github.com/OWASP-Benchmark/BenchmarkJava
  #             benchmark/datasets/owasp/benchmark   (puis mettre enabled: true)
  owasp:
    enabled: true
    adapter: owasp
    path: benchmark/datasets/owasp/benchmark
    expected_results: expectedresults-1.2.csv
    track: detection
    quality: high              # negatifs propres + 1 defaut/fichier -> precision/FPR fiables
    scoring: category          # methode officielle OWASP (scorecard)
    limit: 0                   # 0 = dataset complet (~2740). Mettre 50 pour un 1er run rapide.

  # --- C / C++, negatifs propres (Juliet / NIST SARD) ---
  # Prerequis : telecharger Juliet C/C++ dans benchmark/datasets/juliet/
  #             ET implementer l'adapter juliet (voir adapters/__init__.py).
  juliet:
    enabled: true              # adapter OMIT-split valide (run de controle OK)
    adapter: juliet
    path: benchmark/datasets/juliet
    track: detection
    quality: high
    per_language_limit: 50     # 50 C + 50 C++

# --- Sortie ---
output:
  dir: benchmark/results
  bootstrap_samples: 1000   # pour IC 95% sur le F1
